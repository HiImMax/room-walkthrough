<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Room Walkthrough</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root { --bg:#fbfaf7; --ink:#24211e; --muted:#7a746c; --line:#e5e0d8; --accent:#bf5630; --accent-ink:#fff; --chip:#f1ede6; --r:12px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#cdd6e0; overscroll-behavior:none; }
button,input,select { font:inherit; color:inherit; }
button { cursor:pointer; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; min-height:40px; }
button:active { transform:translateY(1px); }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
button.ghost { background:transparent; border-color:transparent; }
button.danger { color:#a32a1c; }
button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
input,select { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff; min-height:40px; width:100%; }
label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; }
h3:first-child { margin-top:4px; }
.note { font-size:12.5px; color:var(--muted); margin:6px 0; }
.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:1; min-width:0; }
.row > .fit { flex:none; }

#stage { position:fixed; inset:0; }
#stage canvas { width:100%; height:100%; display:block; touch-action:none; }

.glass { background:rgba(251,250,247,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(0,0,0,.08); box-shadow:0 4px 18px rgba(0,0,0,.12); }
#topbar { position:fixed; top:max(8px,env(safe-area-inset-top)); left:8px; right:8px; display:flex; gap:8px; align-items:center; pointer-events:none; z-index:5; }
#topbar > * { pointer-events:auto; }
#topbar .pill { border-radius:14px; display:flex; align-items:center; gap:2px; padding:3px; }
#topbar .pill button { border:none; background:transparent; min-height:38px; padding:6px 12px; border-radius:11px; }
#topbar .pill button.on { background:var(--ink); color:#fff; }
#roomName { font-weight:600; padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
#saveState { font-size:12px; color:var(--muted); padding-right:10px; }
.spacer { flex:1; }

#panel { position:fixed; top:0; bottom:0; left:0; width:min(390px,92vw); background:var(--bg); z-index:10; transform:translateX(-102%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:6px 0 30px rgba(0,0,0,.18); }
#panel.open { transform:none; }
#panelHead { display:flex; align-items:center; gap:4px; padding:max(8px,env(safe-area-inset-top)) 8px 0 8px; border-bottom:1px solid var(--line); }
#tabs { display:flex; flex:1; overflow-x:auto; scrollbar-width:none; }
#tabs::-webkit-scrollbar { display:none; }
#tabs button { border:none; background:transparent; border-radius:10px 10px 0 0; border-bottom:3px solid transparent; padding:8px 7px; font-size:14px; white-space:nowrap; color:var(--muted); }
#tabs button.on { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; background:transparent; }
#panelBody { flex:1; overflow-y:auto; padding:14px 14px calc(30px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }

#selbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); z-index:6; border-radius:16px; padding:6px; display:none; gap:4px; align-items:center; max-width:calc(100vw - 16px); }
#selbar.show { display:flex; }
#selbar .nm { font-weight:600; padding:0 8px; max-width:28vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#selbar button { border:none; background:var(--chip); min-width:42px; padding:6px 10px; }
#selbar button.on { background:var(--ink); color:#fff; }

#stick { position:fixed; left:14px; bottom:calc(74px + env(safe-area-inset-bottom)); width:108px; height:108px; border-radius:50%; z-index:4; touch-action:none; }
#stick i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px; border-radius:50%; background:var(--ink); opacity:.85; pointer-events:none; }
#updown { position:fixed; right:14px; bottom:calc(74px + env(safe-area-inset-bottom)); z-index:4; display:flex; flex-direction:column; gap:8px; }
#updown button { width:52px; height:52px; border-radius:50%; font-size:20px; touch-action:none; user-select:none; -webkit-user-select:none; }
#tools { position:fixed; right:8px; top:calc(112px + env(safe-area-inset-top)); z-index:4; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
#tools button { border-radius:12px; font-size:13px; min-height:38px; padding:6px 11px; }
#tools button.on { background:var(--ink); color:#fff; }
#hint { position:fixed; top:calc(62px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:3; border-radius:12px; padding:8px 14px; font-size:13px; max-width:calc(100vw - 24px); text-align:center; }
#toast { position:fixed; left:50%; top:20%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86vw; text-align:center; }
#toast.show { opacity:1; }

#auth { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:linear-gradient(160deg,#e9e2d6,#cdd6e0); padding:16px; overflow:auto; }
#auth.show { display:flex; }
#auth .card { background:var(--bg); border-radius:18px; padding:26px 22px; width:min(400px,100%); box-shadow:0 20px 60px rgba(0,0,0,.2); }
#auth h1 { font-size:24px; margin:0 0 4px; letter-spacing:-.01em; }
#auth .err { color:#a32a1c; font-size:13px; min-height:18px; margin-top:8px; }
#auth .switch { text-align:center; margin-top:14px; font-size:13.5px; }
#auth a { color:var(--accent); cursor:pointer; text-decoration:underline; }

.item { display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:var(--r); margin-bottom:8px; background:#fff; }
.item .thumb { width:46px; height:46px; border-radius:9px; flex:none; background-size:cover; background-position:center; border:1px solid rgba(0,0,0,.08); }
.item .meta { flex:1; min-width:0; }
.item .meta b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.item .meta span { font-size:12px; color:var(--muted); }
.item button { min-height:36px; padding:6px 10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.grid2 button { text-align:left; background:#fff; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }

.crow { display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:var(--r); background:#fff; margin-bottom:8px; cursor:pointer; }
.crow .chip { width:30px; height:30px; border-radius:8px; border:1px solid rgba(0,0,0,.15); flex:none; }
.crow span { flex:1; }
.ced { border:1px solid var(--line); border-radius:var(--r); background:#fff; padding:12px; margin:-4px 0 10px; }
.ced canvas { display:block; margin:0 auto; touch-action:none; cursor:crosshair; border-radius:50%; }
.ced input[type=range] { padding:0; min-height:28px; border:none; background:transparent; }
.swatches { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.swatches button { display:flex; align-items:center; gap:6px; padding:4px 9px 4px 4px; min-height:34px; font-size:12.5px; border-radius:18px; background:#fff; }
.swatches button i { width:24px; height:24px; border-radius:50%; border:1px solid rgba(0,0,0,.15); }
.photos { display:flex; gap:6px; flex-wrap:wrap; }
.photos img { width:84px; height:64px; object-fit:cover; border-radius:8px; }
a.link { color:var(--accent); }
#hint { transition:opacity .4s; } #hint.hide { opacity:0; pointer-events:none; }
@media (max-width:540px) { .lbl, #saveState { display:none; } #roomName { max-width:36vw; } #topbar { gap:6px; } #selbar .nm { display:none; } #selbar button { padding:6px 7px; min-width:36px; font-size:14px; } #selbar { overflow-x:auto; } }
@media (hover:none) { #hint .desk { display:none; } }
@media (hover:hover) { #hint .touch { display:none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="topbar">
  <div class="pill glass"><button id="menuBtn" aria-label="Open panel">&#9776;<span class="lbl"> Menu</span></button></div>
  <div class="pill glass"><span id="roomName"></span><span id="saveState"></span></div>
  <div class="spacer"></div>
  <div class="pill glass"><button id="undoBtn" title="Undo">&#8630;<span class="lbl"> Undo</span></button></div>
  <div class="pill glass"><button id="v3d" class="on">3D</button><button id="vtop">Top</button></div>
</div>

<div id="hint" class="glass"></div>
<div id="stick" class="glass" aria-label="Move"><i></i></div>
<div id="updown"><button id="upBtn" class="glass" aria-label="Up">&#9650;</button><button id="downBtn" class="glass" aria-label="Down">&#9660;</button></div>
<div id="tools"><button id="collideBtn" class="glass">Collisions: on</button><button id="photoBtn" class="glass">&#128247; Photo</button></div>
<div id="selbar" class="glass"></div>

<aside id="panel">
  <div id="panelHead"><div id="tabs"></div><button id="closePanel" class="ghost" aria-label="Close">&#10005;</button></div>
  <div id="panelBody"></div>
</aside>

<div id="auth"><div class="card" id="authCard"></div></div>
<div id="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
